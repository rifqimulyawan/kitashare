[package]
name = "yourshare"
version = "1.0.0"
description = "YourShare - Cross-Platform Screen Sharing"
authors = ["YourShare"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "yourshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
futures-util = "0.3"
scrap = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
local-ip-address = "0.6"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
