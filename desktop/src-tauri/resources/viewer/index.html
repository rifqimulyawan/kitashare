<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1e40af">
<title>YourShare Viewer</title>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-2: #334155;
  --border: #475569;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #22c55e;
  --warning: #f59e0b;
  --destructive: #ef4444;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-muted: #64748b;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* Skip link */
.skip-link {
  position: absolute; top: -40px; left: 8px; z-index: 1000;
  background: var(--primary); color: #fff; padding: 8px 16px;
  border-radius: 8px; font-size: 14px; font-weight: 600;
  transition: top 0.2s;
}
.skip-link:focus { top: 8px; }

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  min-height: 56px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.logo svg { width: 24px; height: 24px; color: var(--primary); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.status-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
}
.status-badge.connected { background: rgba(34,197,94,0.15); color: var(--success); }
.status-badge.disconnected { background: rgba(239,68,68,0.15); color: var(--destructive); }
.status-badge.connecting { background: rgba(245,158,11,0.15); color: var(--warning); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status-badge.connected .status-dot { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.icon-btn {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; color: var(--text-muted);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.icon-btn svg { width: 20px; height: 20px; }

/* Main area */
.main-area {
  flex: 1; display: flex; overflow: hidden; position: relative;
}
.video-container {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #000; position: relative; overflow: hidden;
}
#stream-canvas {
  max-width: 100%; max-height: 100%; object-fit: contain;
}
.loading-overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  background: rgba(0,0,0,0.7); color: #fff;
}
.spinner {
  width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Chat panel */
.chat-panel {
  width: 340px; max-width: 100%; background: var(--surface);
  border-left: 1px solid var(--border); display: flex; flex-direction: column;
  transition: transform 0.2s; flex-shrink: 0;
}
.chat-panel.hidden { transform: translateX(100%); position: absolute; right: 0; top: 0; bottom: 0; }
.chat-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 15px;
}
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
}
.chat-msg {
  max-width: 85%; padding: 8px 12px; border-radius: 12px;
  font-size: 14px; line-height: 1.4; word-wrap: break-word;
}
.chat-msg.other { background: var(--surface-2); align-self: flex-start; }
.chat-msg.self { background: var(--primary); color: #fff; align-self: flex-end; }
.chat-msg .chat-user { font-size: 11px; font-weight: 700; opacity: 0.7; margin-bottom: 2px; }
.chat-msg .chat-time { font-size: 10px; opacity: 0.5; margin-top: 2px; }
.chat-input-area {
  padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px;
}
.chat-input {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 14px; outline: none; transition: border 0.15s;
}
.chat-input:focus { border-color: var(--primary); }
.chat-input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.chat-send {
  padding: 10px 16px; border-radius: 10px; background: var(--primary);
  color: #fff; font-weight: 600; font-size: 14px; transition: background 0.15s;
}
.chat-send:hover { background: var(--primary-hover); }
.chat-send:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* Controls bar */
.controls-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.control-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--text); transition: background 0.15s;
}
.control-btn:hover { background: var(--border); }
.control-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.control-btn svg { width: 18px; height: 18px; }
.control-btn.active { background: var(--primary); color: #fff; }

/* Join screen */
.join-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 20px; gap: 24px;
}
.join-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 40px; max-width: 420px; width: 100%;
  text-align: center;
}
.join-card h1 { font-size: 28px; margin-bottom: 8px; }
.join-card p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
.join-btn {
  width: 100%; padding: 14px; border-radius: 12px;
  background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
  transition: background 0.15s;
}
.join-btn:hover { background: var(--primary-hover); }
.join-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Responsive */
@media (max-width: 768px) {
  .chat-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 85%; max-width: 320px; z-index: 10; }
  .chat-panel.hidden { transform: translateX(100%); }
  .topbar { padding: 10px 12px; }
  .logo { font-size: 16px; }
  .controls-bar { padding: 8px 12px; flex-wrap: wrap; }
  .control-btn { padding: 6px 10px; font-size: 12px; }
}
@media (max-width: 480px) {
  .status-badge { font-size: 11px; padding: 4px 8px; }
  .control-btn span { display: none; }
}

/* High contrast */
[data-contrast="high"] {
  --border: #64748b;
  --text-muted: #cbd5e1;
}
[data-contrast="high"] .control-btn:focus-visible,
[data-contrast="high"] .icon-btn:focus-visible,
[data-contrast="high"] .chat-input:focus-visible,
[data-contrast="high"] .chat-send:focus-visible {
  outline: 3px solid #fbbf24; outline-offset: 3px;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Large text */
[data-text-size="large"] { font-size: 18px; }
[data-text-size="large"] .chat-msg { font-size: 16px; }
[data-text-size="large"] .control-btn { font-size: 15px; }
</style>
</head>
<body>
<a href="#stream-canvas" class="skip-link">Skip to content</a>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>YourShare</span>
    </div>
  </div>
  <div class="topbar-right">
    <div id="status-badge" class="status-badge disconnected" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
      <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="sun-icon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button class="icon-btn" id="chat-toggle" aria-label="Toggle chat panel" title="Toggle chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
  </div>
</div>

<div class="main-area">
  <div class="video-container">
    <canvas id="stream-canvas" role="img" aria-label="Shared screen stream" tabindex="0"></canvas>
    <div id="loading-overlay" class="loading-overlay">
      <div class="spinner"></div>
      <p id="loading-text">Connecting to host...</p>
    </div>
  </div>

  <div id="chat-panel" class="chat-panel hidden" role="complementary" aria-label="Chat panel">
    <div class="chat-header">
      <span>Chat</span>
      <button class="icon-btn" id="chat-close" aria-label="Close chat" style="width:32px;height:32px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." aria-label="Chat message input" maxlength="1000">
      <button id="chat-send" class="chat-send" aria-label="Send message" disabled>Send</button>
    </div>
  </div>
</div>

<div class="controls-bar">
  <button class="control-btn" id="btn-fullscreen" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <span>Fullscreen</span>
  </button>
  <button class="control-btn" id="btn-snapshot" aria-label="Take snapshot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>Snapshot</span>
  </button>
  <button class="control-btn" id="btn-a11y" aria-label="Accessibility settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-10 10 10 10 0 0 0 10 10 10 10 0 0 0 10-10 10 10 0 0 0-10-10zm0 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 6c-2.5 0-4.5 1.5-4.5 3.5S9.5 20 12 20s4.5-1.5 4.5-3.5S14.5 12 12 12z"/></svg>
    <span>Accessibility</span>
  </button>
</div>

<div id="a11y-panel" style="display:none;position:fixed;bottom:60px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;z-index:100;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,0.3)">
  <h3 style="font-size:16px;margin-bottom:16px">Accessibility</h3>
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;cursor:pointer">
    <input type="checkbox" id="a11y-contrast"> High Contrast
  </label>
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;cursor:pointer">
    <input type="checkbox" id="a11y-large-text"> Large Text
  </label>
  <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
    <input type="checkbox" id="a11y-captions" checked> Visual Notifications
  </label>
</div>

<script>
(function() {
  'use strict';

  // State
  let ws = null;
  let connected = false;
  let canvas = document.getElementById('stream-canvas');
  let ctx = canvas.getContext('2d');
  let loadingOverlay = document.getElementById('loading-overlay');
  let loadingText = document.getElementById('loading-text');
  let statusBadge = document.getElementById('status-badge');
  let statusText = document.getElementById('status-text');
  let chatPanel = document.getElementById('chat-panel');
  let chatMessages = document.getElementById('chat-messages');
  let chatInput = document.getElementById('chat-input');
  let chatSend = document.getElementById('chat-send');
  let lastFrameTime = 0;
  let frameCount = 0;
  let fpsTimer = 0;
  let visualNotify = true;

  // i18n
  const translations = {
    en: { connecting: 'Connecting to host...', disconnected: 'Disconnected', connected: 'Connected', waitingHost: 'Waiting for host to start...', streamEnded: 'Stream has ended', typeMsg: 'Type a message...', send: 'Send', fullscreen: 'Fullscreen', snapshot: 'Snapshot', accessibility: 'Accessibility', highContrast: 'High Contrast', largeText: 'Large Text', visualNotif: 'Visual Notifications' },
    id: { connecting: 'Menghubungkan ke host...', disconnected: 'Terputus', connected: 'Terhubung', waitingHost: 'Menunggu host memulai...', streamEnded: 'Siaran telah berakhir', typeMsg: 'Ketik pesan...', send: 'Kirim', fullscreen: 'Layar Penuh', snapshot: 'Tangkap Layar', accessibility: 'Aksesibilitas', highContrast: 'Kontras Tinggi', largeText: 'Teks Besar', visualNotif: 'Notifikasi Visual' },
    ar: { connecting: 'جارٍ الاتصال بالمضيف...', disconnected: 'غير متصل', connected: 'متصل', waitingHost: 'في انتظار بدء المضيف...', streamEnded: 'انتهى البث', typeMsg: 'اكتب رسالة...', send: 'إرسال', fullscreen: 'ملء الشاشة', snapshot: 'لقطة شاشة', accessibility: 'إمكانية الوصول', highContrast: 'تباين عالي', largeText: 'نص كبير', visualNotif: 'إشعارات مرئية' }
  };
  let lang = localStorage.getItem('yourshare-lang') || (navigator.language || 'en').split('-')[0];
  if (!translations[lang]) lang = 'en';
  const t = (key) => (translations[lang] && translations[lang][key]) || translations.en[key] || key;

  function applyTranslations() {
    loadingText.textContent = t('connecting');
    chatInput.placeholder = t('typeMsg');
    chatSend.textContent = t('send');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  }

  // Theme
  function initTheme() {
    const saved = localStorage.getItem('yourshare-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    setTheme(isDark);
  }
  function setTheme(isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    localStorage.setItem('yourshare-theme', isDark ? 'dark' : 'light');
    document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
    document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
  }
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') !== 'dark';
    setTheme(isDark);
  });

  // WebSocket connection
  function connect() {
    const wsUrl = location.protocol === 'https:' ? 'wss://' : 'ws://' + location.host + '/ws';
    setStatus('connecting');
    loadingText.textContent = t('connecting');
    loadingOverlay.style.display = 'flex';

    try {
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';
    } catch(e) {
      loadingText.textContent = 'Failed to connect: ' + e.message;
      setTimeout(connect, 2000);
      return;
    }

    ws.onopen = function() {
      connected = true;
      setStatus('connected');
      loadingOverlay.style.display = 'none';
      chatSend.disabled = false;
      if (visualNotify) flashScreen('rgba(59,130,246,0.3)');
    };

    ws.onmessage = function(event) {
      if (event.data instanceof ArrayBuffer) {
        handleBinaryFrame(event.data);
      } else {
        handleTextMessage(event.data);
      }
    };

    ws.onclose = function() {
      connected = false;
      setStatus('disconnected');
      chatSend.disabled = true;
      loadingText.textContent = t('streamEnded');
      loadingOverlay.style.display = 'flex';
      setTimeout(connect, 2000);
    };

    ws.onerror = function() {
      connected = false;
      setStatus('disconnected');
    };
  }

  function handleBinaryFrame(data) {
    const view = new Uint8Array(data);
    if (view[0] !== 0x01) return;

    const frameLen = (view[1] << 16) | (view[2] << 8) | view[3];
    const jpegData = view.slice(4, 4 + frameLen);

    const blob = new Blob([jpegData], { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = function() {
      if (canvas.width !== img.width) canvas.width = img.width;
      if (canvas.height !== img.height) canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);

      frameCount++;
      const now = performance.now();
      if (now - fpsTimer > 1000) {
        frameCount = 0;
        fpsTimer = now;
      }
    };
    img.src = url;
  }

  function handleTextMessage(text) {
    try {
      const msg = JSON.parse(text);
      switch(msg.type) {
        case 'info':
          break;
        case 'chat':
          addChatMessage(msg.user, msg.text, msg.timestamp, false);
          if (visualNotify) flashScreen('rgba(59,130,246,0.15)');
          break;
        case 'chat_history':
          if (msg.messages) {
            msg.messages.forEach(function(m) {
              addChatMessage(m.user, m.text, m.timestamp, false);
            });
          }
          break;
      }
    } catch(e) {}
  }

  function setStatus(status) {
    statusBadge.className = 'status-badge ' + status;
    statusText.textContent = t(status === 'connecting' ? 'connecting' : status);
  }

  function flashScreen(color) {
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:' + color + ';pointer-events:none;z-index:9999;transition:opacity 0.3s';
    document.body.appendChild(flash);
    requestAnimationFrame(function() {
      flash.style.opacity = '0';
      setTimeout(function() { flash.remove(); }, 300);
    });
  }

  // Chat
  function addChatMessage(user, text, timestamp, isSelf) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (isSelf ? 'self' : 'other');
    const time = new Date((timestamp || 0) * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    div.innerHTML = '<div class="chat-user">' + escapeHtml(user) + '</div><div>' + escapeHtml(text) + '</div><div class="chat-time">' + time + '</div>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function sendChat() {
    const text = chatInput.value.trim();
    if (!text || !connected) return;
    const msg = JSON.stringify({ type: 'chat', user: 'Viewer', text: text });
    ws.send(msg);
    addChatMessage('You', text, Date.now() / 1000, true);
    chatInput.value = '';
  }

  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });

  // Chat toggle
  document.getElementById('chat-toggle').addEventListener('click', function() {
    chatPanel.classList.toggle('hidden');
    if (!chatPanel.classList.contains('hidden')) chatInput.focus();
  });
  document.getElementById('chat-close').addEventListener('click', function() {
    chatPanel.classList.add('hidden');
  });

  // Fullscreen
  document.getElementById('btn-fullscreen').addEventListener('click', function() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // Snapshot
  document.getElementById('btn-snapshot').addEventListener('click', function() {
    const link = document.createElement('a');
    link.download = 'yourshare-snapshot-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Accessibility panel
  document.getElementById('btn-a11y').addEventListener('click', function() {
    const panel = document.getElementById('a11y-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('a11y-contrast').addEventListener('change', function() {
    document.documentElement.setAttribute('data-contrast', this.checked ? 'high' : 'normal');
    localStorage.setItem('yourshare-contrast', this.checked ? 'high' : 'normal');
  });
  document.getElementById('a11y-large-text').addEventListener('change', function() {
    document.documentElement.setAttribute('data-text-size', this.checked ? 'large' : 'normal');
    localStorage.setItem('yourshare-text-size', this.checked ? 'large' : 'normal');
  });
  document.getElementById('a11y-captions').addEventListener('change', function() {
    visualNotify = this.checked;
    localStorage.setItem('yourshare-visual-notify', this.checked ? '1' : '0');
  });

  // Restore a11y settings
  if (localStorage.getItem('yourshare-contrast') === 'high') {
    document.getElementById('a11y-contrast').checked = true;
    document.documentElement.setAttribute('data-contrast', 'high');
  }
  if (localStorage.getItem('yourshare-text-size') === 'large') {
    document.getElementById('a11y-large-text').checked = true;
    document.documentElement.setAttribute('data-text-size', 'large');
  }
  if (localStorage.getItem('yourshare-visual-notify') === '0') {
    document.getElementById('a11y-captions').checked = false;
    visualNotify = false;
  }

  // Auto-reload in dev mode (polls every 2s, reloads if server restarts)
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    let lastCheck = Date.now();
    setInterval(function() {
      fetch('/api/info').then(function(r) {
        if (!r.ok) location.reload();
      }).catch(function() {
        // Server down, wait and reload when back
        setTimeout(function() { location.reload(); }, 1000);
      });
    }, 3000);
  }

  // Init
  applyTranslations();
  initTheme();
  connect();
})();
</script>
</body>
</html>
